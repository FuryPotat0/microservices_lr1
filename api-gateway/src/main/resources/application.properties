spring.application.name=api-gateway

server.port=8082

eureka.client.service-url.defaultZone=http://localhost:8081/eureka

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/user/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/user/(?<segment>.*),/api/users/$\{segment}

spring.cloud.gateway.routes[1].id=company-service
spring.cloud.gateway.routes[1].uri=lb://company-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/company/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/company/(?<segment>.*),/api/companies/$\{segment}
